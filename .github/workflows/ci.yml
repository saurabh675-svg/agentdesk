name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: backend (python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic httpx websockets jinja2 python-dotenv requests
      - name: Syntax + import check
        run: python -W error::SyntaxWarning -m compileall -q backend/app
      - name: Native core fallback check
        run: python scripts/bench_native.py

  frontend:
    name: frontend (node ${{ matrix.node-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:ui

  rust:
    name: native core (rust)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Build the native accelerator
        working-directory: native/agentdesk_core
        run: |
          cargo build --release --features python --target x86_64-pc-windows-gnu
          cargo test --release
      - name: Upload the extension
        uses: actions/upload-artifact@v4
        with:
          name: agentdesk-core
          path: native/agentdesk_core/target/x86_64-pc-windows-gnu/release/agentdesk_core.dll

  cpp:
    name: cdp helper (c++)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build the CDP helper
        working-directory: native/cdp_helper
        run: |
          cl /std:c++latest /O2 /EHsc /Fe:cdp_helper.exe cdp_helper.cpp ws2_32.lib
      - name: Upload the helper
        uses: actions/upload-artifact@v4
        with:
          name: cdp-helper
          path: native/cdp_helper/cdp_helper.exe

  dotnet:
    name: windows sidecar (dotnet)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build and self-test
        working-directory: native/AgentDesk.Win
        run: |
          dotnet publish -c Release -o .publish
          ./.publish/AgentDesk.Win.exe --selftest
      - name: Upload the sidecar
        uses: actions/upload-artifact@v4
        with:
          name: agentdesk-win-sidecar
          path: native/AgentDesk.Win/.publish

  contracts:
    name: api contract (openapi + generated sdk)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Export OpenAPI and regenerate clients
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic httpx websockets
          python scripts/export_openapi.py
          git diff --exit-code sdk-ts/generated sdk-py/generated docs/openapi.json
