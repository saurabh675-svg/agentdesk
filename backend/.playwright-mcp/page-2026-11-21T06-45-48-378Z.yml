            - generic [ref=e189]:
              - paragraph [ref=e190]: Physics doesn't care if your code compiles. It is relatively easy for a language model to ace a textbook thermodynamics quiz or write a self-contained Python script. Designing a real building is a different sport. Try routing chilled-water piping across seven drawing sheets around an offset structural grid and 104 sprinkler heads without putting a steel beam through an air duct.
              - paragraph [ref=e191]:
                - img "Four Engineering Disciplines in Physical-Engineering's Last Exam" [ref=e192]
              - paragraph [ref=e193]: Most AI benchmarks treat engineering like a trivia night. Models score above 90% on isolated question-answering sets, yet stall out when handed a real project folder. Actual physical engineering isn't a single formula look-up; it is a multi-hour investigation across dozens of messy, interdependent files. Before a school, hospital, semiconductor fab, or data center breaks ground, practicing engineers spend months cross-checking 3D computer-aided design (CAD) geometries, geotechnical soil borings, municipal utility rules, and 50-file specification packages to issue deliverables a licensed reviewer will stamp. Current agents often misread drawing callouts, apply the wrong code clause, drop unit conversions, or quit early—leaving top frontier models scoring below 50%.
              - paragraph [ref=e194]:
                - text: Google Cloud AI Research,
                - link "in partnership with Mercor (opens in a new tab)" [ref=e195] [cursor=pointer]:
                  - /url: https://www.mercor.com/blog/introducing-physical-engineering-s-last-exam-ple-with-google-cloud-ai-research/
                  - text: in partnership with Mercor
                - text: and alongside academic partners from Stanford, NYU, the University of Washington, UNC Chapel Hill, Harvard, and Columbia, is opening the vault with
                - strong [ref=e196]: Physical-Engineering's Last Exam (PLE)
                - text: ". For the first time, this release introduces a benchmark of 85 expert-reviewed, long-horizon engineering tasks across four core disciplines: structural, civil, electrical, and mechanical engineering."
              - paragraph [ref=e197]: In this competition, your task is to build an open-source agent harness, pair it with a Google-sponsored foundation model, and document your engineering findings in a Kaggle Writeup. Instead of wrapping a single prompt around a chatbot, you will engineer the verification loops, CAD and spreadsheet tool integrations, context-management strategies, and self-checks needed to turn raw project folders into graded engineering artifacts—from seismic shear-wall calculations and clay footing settlement memos to clash-free 3D building models in Industry Foundation Classes (IFC4) format and 25-year cooling-tower cost studies.
              - paragraph [ref=e198]: If successful, your work will help take months of tedious planning overhead off the plates of human engineers and compress infrastructure design cycles down to days.
