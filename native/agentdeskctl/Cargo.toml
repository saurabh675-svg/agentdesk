[package]
name = "agentdeskctl"
version = "0.7.0"
edition = "2021"
description = "Headless control of AgentDesk sessions, runs, browser and MCP server"

[[bin]]
name = "agentdeskctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
